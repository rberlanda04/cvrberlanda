<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rogerio H. Berlanda — Currículo & Portfólio</title>
  <meta name="description" content="Currículo web e portfólio de projetos de robótica, cultura maker e educação em tecnologia." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23155e63'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' font-weight='700' fill='%23eefbf9' text-anchor='middle'%3ERB%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Aplica o tema antes da primeira pintura da página, pra não piscar
    // escuro em quem tem o sistema no escuro — o padrão é sempre claro.
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
  </script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="#topo">
        <span class="brand-mark" aria-hidden="true" id="brand-mark"><span id="brand-initials">RB</span></span>
        <span class="brand-name" id="nav-name">Carregando…</span>
      </a>

      <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      </button>
    </nav>
  </header>

  <main id="conteudo">
    <!-- HERO -->
    <section class="hero" id="topo">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="eyebrow" id="hero-role">Carregando…</p>
          <h1 id="hero-name">—</h1>
          <p class="hero-tagline" id="hero-tagline"></p>
          <p class="hero-location" id="hero-location"></p>
          <div class="hero-actions">
            <a href="#portfolio" class="btn btn-primary">Ver portfólio</a>
            <a href="#contato" class="btn btn-ghost">Contato</a>
          </div>
        </div>
        <div class="hero-avatar" aria-hidden="true" id="hero-avatar">
          <span id="hero-initials">RB</span>
        </div>
      </div>
    </section>

    <!-- SOBRE -->
    <section class="section" id="sobre">
      <div class="container">
        <h2 class="section-title" id="about-heading">Sobre</h2>
        <div class="about-text" id="about-text"></div>
      </div>
    </section>

    <!-- EXPERIÊNCIA ATUAL -->
    <section class="section section-alt" id="experiencia">
      <div class="container">
        <h2 class="section-title" id="roles-heading">Onde estou trabalhando</h2>
        <div class="cards-grid" id="roles-grid"></div>
      </div>
    </section>

    <!-- SKILLS -->
    <section class="section" id="skills">
      <div class="container">
        <h2 class="section-title" id="skills-heading">Áreas de atuação</h2>
        <div class="skills-groups" id="skills-groups"></div>
      </div>
    </section>

    <!-- TECNOLOGIAS / PORTAL VISUAL DE LOGOS -->
    <section class="section section-alt" id="tecnologias">
      <div class="container">
        <h2 class="section-title" id="tech-heading">Tecnologias & Ferramentas</h2>
        <p class="section-intro" id="tech-intro"></p>
        <div id="tech-groups"></div>
      </div>
    </section>

    <!-- PARCEIROS / ALINHAMENTO -->
    <section class="section" id="parceiros">
      <div class="container">
        <h2 class="section-title" id="partners-heading">Parceiros & Alinhamento</h2>
        <p class="section-intro" id="partners-intro"></p>
        <div class="tech-grid" id="partners-grid"></div>
      </div>
    </section>

    <!-- LINHA DO TEMPO / PORTFÓLIO -->
    <section class="section section-alt" id="portfolio">
      <div class="container">
        <h2 class="section-title" id="timeline-heading">Linha do tempo — Portfólio</h2>
        <p class="section-intro" id="timeline-intro"></p>
        <ol class="timeline" id="timeline-list"></ol>
        <button class="timeline-expand" id="timeline-expand" aria-expanded="false" aria-controls="timeline-list" aria-label="Ver linha do tempo completa">
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </section>

    <!-- COMPETIÇÕES -->
    <section class="section" id="competicoes">
      <div class="container">
        <h2 class="section-title" id="competitions-heading">Olimpíadas, competições e eventos</h2>
        <p class="section-intro" id="competitions-intro"></p>
        <ul class="chip-grid" id="competitions-grid"></ul>
        <p class="footnote" id="competitions-footnote"></p>
      </div>
    </section>

    <!-- CÓDIGO ABERTO -->
    <section class="section section-alt" id="codigo-aberto">
      <div class="container">
        <button class="github-toggle" id="github-toggle" aria-expanded="false" aria-controls="github-panel" aria-label="Código aberto — ver repositórios">
          <img class="github-toggle-logo" src="assets/logos/tool-github.svg" alt="Código aberto" />
          <svg class="chevron github-toggle-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="github-panel" id="github-panel">
          <ul class="chip-grid" id="github-grid"></ul>
        </div>
      </div>
    </section>

    <!-- PROJETOS MENTORADOS -->
    <section class="section" id="mentorados">
      <div class="container">
        <h2 class="section-title" id="mentored-heading">Projetos mentorados</h2>
        <p class="section-intro" id="mentored-intro"></p>
        <p class="stats-label" id="mentored-stats-label"></p>
        <div class="stats-grid" id="mentored-stats"></div>
        <div class="cards-grid" id="mentored-grid"></div>
      </div>
    </section>

    <!-- CONTATO -->
    <section class="section section-alt" id="contato">
      <div class="container contact-grid">
        <ul class="contact-icons" id="contact-icons"></ul>
        <p class="contact-location" id="contact-location"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <p id="footer-name">—</p>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
