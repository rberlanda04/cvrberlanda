<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel — Contatos e Projetos</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23155e63'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' font-weight='700' fill='%23eefbf9' text-anchor='middle'%3ERB%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
  </script>
</head>
<body>
  <div class="admin-page">
    <!-- LOGIN -->
    <div class="admin-login-wrap" id="admin-login-wrap">
      <div class="admin-login-card">
        <h1 class="section-title" style="text-align: center;">Painel</h1>
        <p class="section-intro" style="text-align: center; margin-inline: auto;">Login restrito.</p>
        <p class="field-error" id="admin-login-error" role="alert"></p>
        <button type="button" class="btn btn-primary" id="admin-google-btn">Entrar com Google</button>
      </div>
    </div>

    <!-- PAINEL -->
    <div class="admin-dashboard" id="admin-dashboard" hidden>
      <header class="admin-header">
        <span class="admin-header-title">Painel</span>
        <button class="wizard-nav-btn" id="admin-logout">Sair</button>
      </header>

      <div class="container admin-container">
        <section class="admin-section">
          <h2 class="section-title">Projetos para avaliar</h2>
          <p class="section-intro" id="projects-empty">Carregando…</p>
          <div class="admin-list" id="projects-list"></div>
        </section>

        <section class="admin-section">
          <h2 class="section-title">Mensagens de contato</h2>
          <p class="section-intro" id="messages-empty">Carregando…</p>
          <div class="admin-list" id="messages-list"></div>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
