<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel — Portfólio, Eventos e Contatos</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/logos/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
  </script>
</head>
<body>
  <div class="admin-page">
    <!-- LOGIN -->
    <div class="admin-login-wrap" id="admin-login-wrap">
      <div class="admin-login-card">
        <h1 class="section-title" style="text-align: center;">Painel</h1>
        <p class="section-intro" style="text-align: center; margin-inline: auto;">Login restrito.</p>
        <p class="field-error" id="admin-login-error" role="alert"></p>
        <button type="button" class="btn btn-primary" id="admin-google-btn">Entrar com Google</button>
      </div>
    </div>

    <!-- PAINEL -->
    <div class="admin-dashboard" id="admin-dashboard" hidden>
      <header class="admin-header">
        <span class="admin-header-title">Painel</span>
        <button class="wizard-nav-btn" id="admin-logout">Sair</button>
      </header>

      <div class="container admin-overview-wrap">
        <div class="admin-overview-head">
          <span class="admin-overview-title">Visão geral</span>
          <button type="button" class="wizard-nav-btn" id="refresh-overview-btn">↻ Atualizar</button>
        </div>
        <div class="admin-overview" id="admin-overview">
          <div class="stat-tile">
            <span class="stat-count" id="stat-visits">—</span>
            <span class="stat-label">Acessos ao currículo</span>
          </div>
          <div class="stat-tile">
            <span class="stat-count" id="stat-projects">—</span>
            <span class="stat-label">Projetos cadastrados</span>
          </div>
          <div class="stat-tile">
            <span class="stat-count" id="stat-events">—</span>
            <span class="stat-label">Eventos publicados</span>
          </div>
          <div class="stat-tile">
            <span class="stat-count" id="stat-messages">—</span>
            <span class="stat-label">Mensagens recebidas</span>
          </div>
        </div>
      </div>

      <nav class="admin-tabs" id="admin-tabs">
        <button type="button" class="admin-tab" data-tab="projects" aria-selected="true">Portfólio</button>
        <button type="button" class="admin-tab" data-tab="events" aria-selected="false">Eventos</button>
        <button type="button" class="admin-tab" data-tab="messages" aria-selected="false">Mensagens</button>
      </nav>

      <div class="container admin-container">
        <section class="admin-section" id="tab-projects">
          <div class="admin-section-head">
            <div>
              <h2 class="section-title">Portfólio de projetos</h2>
              <p class="section-intro" id="projects-empty">Carregando…</p>
            </div>
            <button type="button" class="btn btn-primary" id="new-project-btn">+ Novo projeto</button>
          </div>
          <div class="admin-list" id="projects-list"></div>
        </section>

        <section class="admin-section" id="tab-events" hidden>
          <div class="admin-section-head">
            <div>
              <h2 class="section-title">Eventos</h2>
              <p class="section-intro" id="events-empty">Carregando…</p>
            </div>
            <button type="button" class="btn btn-primary" id="new-event-btn">+ Novo evento</button>
          </div>
          <div class="admin-list" id="events-list"></div>
        </section>

        <section class="admin-section" id="tab-messages" hidden>
          <h2 class="section-title">Mensagens de contato</h2>
          <p class="section-intro" id="messages-empty">Carregando…</p>
          <div class="admin-list" id="messages-list"></div>
        </section>
      </div>
    </div>

    <!-- MODAL: criar/editar projeto ou evento -->
    <div class="admin-modal-overlay" id="admin-modal-overlay" hidden>
      <div class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
        <div class="admin-modal-head">
          <h3 id="admin-modal-title">Novo projeto</h3>
          <button type="button" class="admin-modal-close" id="admin-modal-close" aria-label="Fechar">&times;</button>
        </div>
        <form class="admin-modal-form" id="admin-modal-form" novalidate>
          <div id="admin-modal-fields"></div>
          <p class="field-error" id="admin-modal-error" role="alert"></p>
          <div class="admin-modal-actions">
            <button type="button" class="wizard-nav-btn" id="admin-modal-cancel">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="admin-modal-save">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
